name: Quest pack validator tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Check validator syntax
        run: python -m py_compile validator/validate_pack.py
