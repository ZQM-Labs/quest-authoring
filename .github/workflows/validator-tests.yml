name: Quest pack validator tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Check validator syntax
        run: python -m py_compile validator/validate_pack.py
